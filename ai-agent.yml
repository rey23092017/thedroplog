name: Autonomous AI Agent (Gadget Hunter)

on:
  schedule:
    # Run at 10:00 AM UTC (3:30 PM IST) every Friday
    - cron: '0 10 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt-for-gadgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node ai-agent.js

      - name: Commit and push changes if any gadgets were found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.csv
          git diff --staged --quiet || (git commit -m "feat: AI Agent found new gadgets!" && git push)
